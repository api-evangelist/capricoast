  project floor plans. The company was acquired by HomeLane in November 2017 and no longer operates
  independently; its domain (capricoast.com) is now parked/for-sale and it publishes no developer, API, or
  documentation surface. Sector: consumer. Retained in the network as an Accel portfolio record; no API
  artifacts are available to enrich.'
